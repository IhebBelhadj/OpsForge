openapi: 3.1.0
info:
  title: OpsForge Academy
  version: 0.1.0
  description: >-
    The platform's HTTP API (docs/courses/architecture.md, "HTTP API"). Written before the handlers: oapi-codegen
    generates the Go server interface (internal/httpapi), openapi-typescript the web client (web/src/api).
    Errors are RFC 9457 problem documents.
  license:
    name: Proprietary
    identifier: LicenseRef-OpsForge
servers:
  - url: http://127.0.0.1:8090
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: The process is up
      tags: [operations]
      security: []
      responses:
        "200":
          description: Always, while the process serves requests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      operationId: getReadyz
      summary: The database and the lab toolchain answer
      tags: [operations]
      security: []
      responses:
        "200":
          description: Every check passed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: At least one check failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
  /api/v1/sessions:
    post:
      operationId: openSession
      summary: Sign the local user in
      description: >-
        Opens a session for the local user: the token goes in an HttpOnly, SameSite=Strict cookie, the response
        carries the CSRF token the page sends as X-CSRF-Token on every change. The page calls it when GET /api/v1/me
        answers 401. Refused (403) from another site's page.
      tags: [identity]
      security: []
      responses:
        "201":
          description: Signed in.
          headers:
            Set-Cookie:
              description: "academy_session=<token>; Path=/; Max-Age=2592000; HttpOnly; SameSite=Strict"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/me:
    get:
      operationId: getMe
      summary: Who is signed in
      description: The user and the session's CSRF token (a reloaded page has the cookie but not the token).
      tags: [identity]
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/NoSession" }
  /api/v1/admin/import:
    post:
      operationId: importContent
      summary: Re-import the packs
      description: >-
        Compiles the repository's packs (`opsforge academy compile`) and brings the catalogue to them; also done at
        start. Importing unchanged packs changes nothing (changed is false). Removed content is retired, never
        deleted. A bundle with errors is not imported (422, the errors listed).
      tags: [content]
      responses:
        "200":
          description: Imported; counts per kind of entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportReport" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: The packs have validation errors; nothing was imported.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: The toolchain failed (not installed, crashed, or speaks another contract).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /api/v1/courses:
    get:
      operationId: listCourses
      summary: The catalogue
      description: The live courses (retired ones are left out), by pack then position.
      tags: [content]
      responses:
        "200":
          description: The courses.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseList" }
        "401": { $ref: "#/components/responses/NoSession" }
  /api/v1/courses/{course}:
    parameters:
      - { name: course, in: path, required: true, schema: { type: string } }
    get:
      operationId: getCourse
      summary: A course page
      description: The course with its sections and their items in order.
      tags: [content]
      responses:
        "200":
          description: The course.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "401": { $ref: "#/components/responses/NoSession" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/courses/{course}/items/{item}:
    parameters:
      - { name: course, in: path, required: true, schema: { type: string } }
      - { name: item, in: path, required: true, schema: { type: string } }
    get:
      operationId: getItem
      summary: One item of a course
      description: >-
        The item with the content of its type: a lecture's Markdown, what a quiz attempt will be (its questions come
        with the attempt), a lab's texts and steps, a challenge's statement and starting files. What is earned never
        appears: quiz keys and explanations, reference solutions, how checks and tests run, hint texts. Texts keep
        their placeholders (${node:<site>}, ${ns}, ...).
      tags: [content]
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "401": { $ref: "#/components/responses/NoSession" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/terminals:
    post:
      operationId: openTerminal
      summary: Start a shell for a browser terminal
      description: >-
        Starts an interactive shell on a pty and returns its session id; the client then connects a WebSocket to
        /ws/terminal/{session} (binary frames out, JSON frames in, see internal/httpapi/terminal.go). A session
        survives 60 s without a client and replays its last 64 KiB of output on reconnect.
      tags: [terminals]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TerminalSize" }
      responses:
        "201":
          description: The shell is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalSession" }
        "400":
          description: The size is out of range.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429":
          description: Too many terminals are open.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
security:
  - session: []
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: academy_session
      description: >-
        Every /api/v1 operation but openSession needs the session cookie; every change (POST, PUT, PATCH, DELETE)
        also needs the session's CSRF token in X-CSRF-Token, and is refused when its Origin is another site.
  responses:
    NoSession:
      description: No valid session (no cookie, an unknown or expired one); POST /api/v1/sessions opens one.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: A change from another site's page (Origin, Sec-Fetch-Site) or without the session's CSRF token.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such entry in the catalogue, or it was retired (removed from the packs).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    User:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    Me:
      type: object
      required: [user, csrf]
      properties:
        user: { $ref: "#/components/schemas/User" }
        csrf: { type: string, description: "Send as X-CSRF-Token on every change" }
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string, description: Build version of the academy binary }
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, unavailable] }
        checks:
          type: array
          items: { $ref: "#/components/schemas/Check" }
    Check:
      type: object
      required: [name, ok]
      properties:
        name: { type: string, description: "database or toolchain" }
        ok: { type: boolean }
        detail: { type: string, description: Why the check failed }
    TerminalSize:
      type: object
      properties:
        cols: { type: integer, minimum: 2, maximum: 1000, default: 80 }
        rows: { type: integer, minimum: 2, maximum: 1000, default: 24 }
    TerminalSession:
      type: object
      required: [session]
      properties:
        session: { type: string, description: "Opaque session id for /ws/terminal/{session}" }
    Strings:
      type: array
      items: { type: string }
    Layout:
      type: [string, "null"]
      enum: [stretched, multi-cluster, null]
      description: The lab layout it needs; null for any
    CourseSummary:
      type: object
      required: [id, pack, title, subtitle, level, minutes, needs, requires, layout, badge, items]
      properties:
        id: { type: string }
        pack: { type: string }
        title: { type: string }
        subtitle: { type: string }
        level: { type: string, enum: [beginner, intermediate, advanced] }
        minutes: { type: integer }
        needs: { $ref: "#/components/schemas/Strings", description: "Lab features it needs (vpn, k3s, ...)" }
        requires: { $ref: "#/components/schemas/Strings", description: Courses to complete first }
        layout: { $ref: "#/components/schemas/Layout" }
        badge: { type: [string, "null"], description: The badge completing it awards }
        items: { type: integer, description: Items in all its sections }
    CourseList:
      type: object
      required: [courses]
      properties:
        courses:
          type: array
          items: { $ref: "#/components/schemas/CourseSummary" }
    Course:
      allOf:
        - { $ref: "#/components/schemas/CourseSummary" }
        - type: object
          required: [description, outcomes, requirements, content_hash, sections]
          properties:
            description: { type: string, description: Markdown }
            outcomes: { $ref: "#/components/schemas/Strings" }
            requirements: { $ref: "#/components/schemas/Strings" }
            content_hash: { type: string }
            sections:
              type: array
              items: { $ref: "#/components/schemas/Section" }
    Section:
      type: object
      required: [title, layout, needs, minutes, items]
      properties:
        title: { type: string }
        layout: { $ref: "#/components/schemas/Layout" }
        needs: { $ref: "#/components/schemas/Strings" }
        minutes: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/ItemRef" }
    ItemType:
      type: string
      enum: [lecture, quiz, lab, challenge]
    ItemRef:
      type: object
      required: [id, type, title, minutes, content_hash]
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/ItemType" }
        title: { type: string }
        minutes: { type: integer }
        content_hash: { type: string }
    Item:
      type: object
      description: Exactly one of lecture, quiz, lab and challenge is set, the one its type names.
      required: [course, id, type, title, minutes, section, content_hash]
      properties:
        course: { type: string }
        id: { type: string }
        type: { $ref: "#/components/schemas/ItemType" }
        title: { type: string }
        minutes: { type: integer }
        section: { type: integer, description: Index of its section in the course }
        content_hash: { type: string }
        lecture: { $ref: "#/components/schemas/Lecture" }
        quiz: { $ref: "#/components/schemas/QuizInfo" }
        lab: { $ref: "#/components/schemas/LabView" }
        challenge: { $ref: "#/components/schemas/ChallengeView" }
      additionalProperties: false
    Lecture:
      type: object
      required: [markdown, resources]
      properties:
        markdown: { type: string }
        resources:
          type: array
          items: { $ref: "#/components/schemas/Resource" }
    Resource:
      type: object
      required: [title, url]
      properties:
        title: { type: string }
        url: { type: string, description: A link the lecture recommends }
    QuizInfo:
      type: object
      required: [pass, xp, time_limit_s, questions]
      additionalProperties: false
      properties:
        pass: { type: integer, description: Percentage of the questions to get right }
        xp: { type: integer }
        time_limit_s: { type: [integer, "null"] }
        questions: { type: integer, description: Questions per attempt }
    ChallengeView:
      type: object
      required: [difficulty, xp, needs, statement, files, starter, time_limit_s, tests, hints]
      additionalProperties: false
      properties:
        difficulty: { type: string, enum: [easy, medium, hard] }
        xp: { type: integer }
        needs: { $ref: "#/components/schemas/Strings" }
        statement: { type: string, description: Markdown }
        files: { $ref: "#/components/schemas/Strings", description: The files the learner writes }
        starter:
          type: object
          description: Starting content per file
          additionalProperties: { type: string }
        time_limit_s: { type: integer }
        tests: { $ref: "#/components/schemas/Strings", description: The test cases' names }
        hints: { type: integer, description: How many hints there are }
    LabView:
      type: object
      required: [id, summary, xp, needs, requires, layout, briefing, debrief, concepts, cluster_changes, namespace,
                 files, steps]
      additionalProperties: false
      properties:
        id: { type: string }
        summary: { type: string }
        xp: { type: integer }
        needs: { $ref: "#/components/schemas/Strings" }
        requires: { $ref: "#/components/schemas/Strings", description: Labs to pass first }
        layout: { $ref: "#/components/schemas/Layout" }
        briefing: { type: string, description: Markdown }
        debrief: { type: string, description: Markdown }
        concepts: { $ref: "#/components/schemas/Strings" }
        cluster_changes: { $ref: "#/components/schemas/Strings", description: Changes outside its namespace }
        namespace: { type: boolean, description: "The lab gets its own namespace (${ns})" }
        files: { $ref: "#/components/schemas/Strings", description: Files copied into the workspace }
        steps:
          type: array
          items: { $ref: "#/components/schemas/LabStep" }
    LabStep:
      type: object
      required: [id, title, body, check, hints]
      additionalProperties: false
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string, description: Markdown }
        open: { type: string, description: A workspace file the step opens }
        check: { $ref: "#/components/schemas/StepCheck" }
        hints: { type: integer, description: How many hints there are }
    StepCheck:
      type: object
      required: [type]
      additionalProperties: false
      description: >-
        How the step is passed: probe (the platform observes the lab), confirm (the learner says so; label on the
        button) or quiz (question and choices; the answer stays on the server).
      properties:
        type: { type: string, enum: [probe, confirm, quiz] }
        label: { type: string }
        question: { type: string }
        choices: { $ref: "#/components/schemas/Strings" }
    EntryCounts:
      type: object
      description: >-
        Entries per kind (pack, course, item, lecture, quiz, challenge, lab, badge); kinds with none are left out.
      additionalProperties: { type: integer, minimum: 1 }
    ImportReport:
      type: object
      required: [changed, added, updated, retired, unchanged]
      properties:
        changed: { type: boolean, description: "false: the catalogue already matched the packs" }
        added: { $ref: "#/components/schemas/EntryCounts" }
        updated: { $ref: "#/components/schemas/EntryCounts" }
        retired: { $ref: "#/components/schemas/EntryCounts" }
        unchanged: { $ref: "#/components/schemas/EntryCounts" }
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type: { type: string, description: "Stable URI reference, e.g. /problems/not-found" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          description: Validation errors (/problems/invalid-packs), one per problem found in a pack.
          items: { $ref: "#/components/schemas/PackError" }
    PackError:
      type: object
      required: [pack, message]
      properties:
        pack: { type: string }
        message: { type: string, description: "<path in the pack>: what is wrong" }
