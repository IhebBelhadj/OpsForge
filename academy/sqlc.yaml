# sqlc: typed Go for each module's queries.sql (make gen). Queries stay portable SQL (docs/courses/architecture.md).
version: "2"
sql:
  - engine: sqlite
    schema: migrations
    queries: internal/platform/sqlite/queries.sql
    gen:
      go: &go
        package: sqlite
        out: internal/platform/sqlite
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_files_suffix: .gen
  - engine: sqlite
    schema: migrations
    queries: internal/identity/sqlite/queries.sql
    gen:
      go:
        <<: *go
        out: internal/identity/sqlite
