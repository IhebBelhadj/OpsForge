# Scenario cluster-failover: the client cluster has no backend, only a Listener for it (Service backend.mesh) and an
# ingress path to it, so its node reaches the backend through its own Traefik: http://<node>/backend
apiVersion: skupper.io/v2alpha1
kind: Listener
metadata:
  name: backend
  namespace: mesh
spec:
  routingKey: backend
  host: backend
  port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: mesh
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /backend
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
