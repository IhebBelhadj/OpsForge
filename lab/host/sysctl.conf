# OpsForge lab: host limits for running many system containers with K3s inside
net.ipv4.ip_forward = 1
# K3s/containerd in containers exhausts the defaults ("too many open files")
fs.inotify.max_user_instances = 1024
fs.inotify.max_user_watches = 524288
# Each container keeps its own kernel keyrings
kernel.keys.maxkeys = 2000
kernel.keys.maxbytes = 2000000
