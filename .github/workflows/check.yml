---
name: check
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install pyyaml jsonschema pytest yamllint ansible-core ansible-lint
      - name: Lint (needs no Incus)
        run: make lint-shell lint-yaml lint-python lint-ansible
      - name: Validate the topology; run unit tests
        run: make validate test
