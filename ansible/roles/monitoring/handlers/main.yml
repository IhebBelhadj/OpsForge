- name: Refresh the package lists
  ansible.builtin.apt:
    update_cache: true

- name: Restart VictoriaMetrics
  ansible.builtin.systemd_service:
    name: victoria-metrics
    state: restarted

- name: Restart Grafana
  ansible.builtin.systemd_service:
    name: grafana-server
    state: restarted
