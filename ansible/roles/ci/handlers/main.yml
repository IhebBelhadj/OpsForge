- name: Restart Gitea
  ansible.builtin.systemd_service:
    name: gitea
    state: restarted
    daemon_reload: true

- name: Restart the registry
  ansible.builtin.systemd_service:
    name: docker-registry
    state: restarted

- name: Restart the runner
  ansible.builtin.systemd_service:
    name: gitea-runner
    state: restarted
    daemon_reload: true
