- name: Create a work tree for {{ ci_seed_repo }}
  ansible.builtin.tempfile:
    state: directory
    suffix: "-{{ ci_seed_repo }}"
  register: ci_seed_dir

- name: Copy the webapp's source
  ansible.builtin.copy:
    src: webapp/
    dest: "{{ ci_seed_dir.path }}/"
    mode: preserve
  when: ci_seed_repo == ci_app_repo

- name: Create the deploy manifests' directories
  ansible.builtin.file:
    path: "{{ ci_seed_dir.path }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ ['webapp', 'postgres'] + lab_clusters | map('regex_replace', '^', 'clusters/') | list }}"
  when: ci_seed_repo == ci_deploy_repo

- name: Render the deploy manifests
  ansible.builtin.template:
    src: "deploy/{{ item.src }}"
    dest: "{{ ci_seed_dir.path }}/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: webapp-kustomization.yaml.j2, dest: webapp/kustomization.yaml }
    - { src: namespace.yaml.j2, dest: webapp/namespace.yaml }
    - { src: webapp.yaml.j2, dest: webapp/webapp.yaml }
    - { src: postgres-kustomization.yaml.j2, dest: postgres/kustomization.yaml }
    - { src: postgres.yaml.j2, dest: postgres/postgres.yaml }
  when: ci_seed_repo == ci_deploy_repo

# One directory per K3s cluster, applied by that cluster's Flux
- name: Render each cluster's deploy directory
  ansible.builtin.template:
    src: "deploy/{{ item.1.src }}"
    dest: "{{ ci_seed_dir.path }}/clusters/{{ item.0 }}/{{ item.1.dest }}"
    mode: "0644"
  vars:
    ci_cluster: "{{ item.0 }}"
  loop: "{{ lab_clusters | list | product(ci_cluster_files) | list }}"
  loop_control:
    label: "clusters/{{ item.0 }}/{{ item.1.dest }}"
  when: ci_seed_repo == ci_deploy_repo and (item.1.when is not defined or item.1.when == (item.0 == ci_db_cluster))

- name: Push the initial commit of {{ ci_seed_repo }}
  ansible.builtin.shell: |
    set -euo pipefail
    git init -q -b main
    git add -A
    git -c user.name={{ ci_admin_user }} -c user.email={{ ci_admin_user }}@noreply.{{ lab_domain }} \
      commit -qm "Initial commit (seeded by OpsForge)"
    git -c http.extraHeader="Authorization: Basic {{ (ci_admin_user ~ ':' ~ ci_admin_password) | b64encode }}" \
      push -q http://127.0.0.1:{{ ci_gitea_port }}/{{ ci_admin_user }}/{{ ci_seed_repo }}.git main
  args:
    chdir: "{{ ci_seed_dir.path }}"
    executable: /bin/bash
  changed_when: true
  no_log: true

- name: Remove the work tree
  ansible.builtin.file:
    path: "{{ ci_seed_dir.path }}"
    state: absent
