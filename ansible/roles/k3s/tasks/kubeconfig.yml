- name: Wait for the server's kubeconfig
  ansible.builtin.wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    timeout: 120

- name: Read the server's kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig_file

# The server URL is https://127.0.0.1:6443: moved to the cluster's own local port, which `opsforge kubectl` forwards
# to this server. K3s names everything "default": renamed after the cluster, so kubeconfigs can be merged.
- name: Save the kubeconfig on the controller
  ansible.builtin.copy:
    content: >-
      {{ k3s_kubeconfig_file.content | b64decode
      | replace('127.0.0.1:' ~ k3s_api_port, '127.0.0.1:' ~ k3s_host_api_port)
      | regex_replace('(?m)^(\\s*(?:- )?(?:name|cluster|user|current-context): )default$', '\\g<1>' ~ k3s_cluster) }}
    dest: "{{ k3s_kubeconfig }}"
    mode: "0600"
  delegate_to: localhost
