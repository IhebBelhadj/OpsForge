- name: Wait for the server's kubeconfig
  ansible.builtin.wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    timeout: 120

- name: Read the server's kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig_file

# The server URL is already https://127.0.0.1:6443, which `opsforge kubectl` forwards to this server
- name: Save the kubeconfig on the controller
  ansible.builtin.copy:
    content: "{{ k3s_kubeconfig_file.content | b64decode | replace('127.0.0.1:6443', '127.0.0.1:' ~ k3s_api_port) }}"
    dest: "{{ k3s_kubeconfig }}"
    mode: "0600"
  delegate_to: localhost
