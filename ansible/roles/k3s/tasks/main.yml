# K3s in unprivileged containers (profile k3s-node, set by opsforge up). The binary is fetched once to the
# controller and copied over the management path, like an air-gapped install; images come through the lab's
# pull-through cache.
- name: Download the K3s binary to the controller
  run_once: true
  delegate_to: localhost
  block:
    - name: Create the controller's K3s directory
      ansible.builtin.file:
        path: "{{ k3s_cache_dir }}"
        state: directory
        mode: "0700"

    - name: Download K3s {{ k3s_version }}
      ansible.builtin.get_url:
        url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version | urlencode }}/k3s"
        dest: "{{ k3s_cache_dir }}/k3s-{{ k3s_version }}"
        checksum: "sha256:{{ k3s_sha256 }}"
        mode: "0755"

- name: Install the K3s binary
  ansible.builtin.copy:
    src: "{{ k3s_cache_dir }}/k3s-{{ k3s_version }}"
    dest: /usr/local/bin/k3s
    mode: "0755"
  notify: Restart k3s

- name: Link kubectl, crictl and ctr to K3s
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: "/usr/local/bin/{{ item }}"
    state: link
  loop: [kubectl, crictl, ctr]

- name: Create the K3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Configure K3s
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/rancher/k3s/{{ item.dest }}"
    mode: "0600"
  loop:
    - { src: config.yaml.j2, dest: config.yaml }
    - { src: registries.yaml.j2, dest: registries.yaml }
    - { src: flannel.json.j2, dest: flannel.json }
  notify: Restart k3s

- name: Install the K3s unit
  ansible.builtin.template:
    src: k3s.service.j2
    dest: /etc/systemd/system/k3s.service
    mode: "0644"
  notify: Restart k3s

- name: Configure the server's workloads
  ansible.builtin.include_tasks: server.yml
  when: lab_role == 'k3s-server'

# A first install starts K3s once, from the restart handler, instead of starting it then restarting it
- name: Apply configuration changes
  ansible.builtin.meta: flush_handlers

- name: Run K3s at boot
  ansible.builtin.systemd_service:
    name: k3s
    state: started
    enabled: true

# Program runtimes (the document's `runtimes`): pulled now through the cache, so a program step starts at once
- name: Check the program runtimes' images
  ansible.builtin.command: crictl inspecti {{ item }}
  loop: "{{ lab_runtime_images }}"
  register: k3s_runtime_images
  changed_when: false
  failed_when: false

- name: Pull the program runtimes' images
  ansible.builtin.command: crictl pull {{ item.item }}
  loop: "{{ k3s_runtime_images.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
  changed_when: true

- name: Fetch the kubeconfig
  ansible.builtin.include_tasks: kubeconfig.yml
  when: lab_role == 'k3s-server'
