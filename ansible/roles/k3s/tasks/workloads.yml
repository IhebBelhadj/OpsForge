# Run on the server after the agents' play (site.yml): workloads are spread over regions when they are scheduled,
# so every node must have joined and be Ready first.
- name: Wait for every K3s node to be Ready
  ansible.builtin.command: k3s kubectl get nodes -o jsonpath='{.items[*].status.conditions[?(@.type=="Ready")].status}'
  register: k3s_ready
  check_mode: false  # read-only
  until: k3s_ready.stdout.split() | select('equalto', 'True') | list | length == k3s_nodes | length
  retries: 60
  delay: 3
  changed_when: false
  vars:
    k3s_nodes: "{{ k3s_cluster_nodes }}"

- name: Install the sample workload manifest
  ansible.builtin.template:
    src: demo.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/opsforge-demo.yaml
    mode: "0600"

- name: Install the monitoring manifest
  ansible.builtin.template:
    src: monitoring.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/opsforge-monitoring.yaml
    mode: "0600"
  when: groups['monitoring'] | default([]) | length > 0

- name: Install Flux
  ansible.builtin.include_tasks: flux.yml
  when: groups['ci'] | default([]) | length > 0

- name: Link the clusters with Skupper
  ansible.builtin.include_tasks: skupper.yml
  when: lab_clusters | length > 1
