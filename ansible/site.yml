# Provisioning (docs/PLAN.md Phases 2, 4, 5 and 7): ./opsforge provision, or ansible-playbook site.yml from ansible/.
# Every host is reached over SSH from the controller, through wan-core and its site's gateway.
- name: Base system
  hosts: lab
  roles:
    - base

# Servers first: nodes switch their resolver to the gateway only once it answers
- name: Site DNS servers
  hosts: gateways
  roles:
    - dns

- name: Site DNS clients
  hosts: nodes
  roles:
    - dns

- name: Lab PKI
  hosts: nodes
  roles:
    - pki

# Phase 7: before K3s, so the first build (started by seeding the webapp repository) runs while the cluster installs.
# Needs the node's certificate (pki) for the registry.
- name: CI/CD
  hosts: ci
  roles:
    - ci

# Server first: agents join it across the VPN (docs/PLAN.md Phase 4)
- name: K3s server
  hosts: k3s_server
  roles:
    - k3s

- name: K3s agents
  hosts: k3s_agent
  roles:
    - k3s

- name: K3s workloads
  hosts: k3s_server
  tasks:
    - name: Deploy the sample workload once every node is Ready
      ansible.builtin.include_role:
        name: k3s
        tasks_from: workloads.yml

# Phase 5: exporters everywhere, then the monitoring node (after K3s: it copies the cluster's scrape token)
- name: Exporters
  hosts: lab
  roles:
    - exporters

- name: Monitoring
  hosts: monitoring
  roles:
    - monitoring
